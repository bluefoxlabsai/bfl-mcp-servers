# Default values for placer-ai-mcp.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

# Namespace configuration
# Note: The actual namespace is set via helm install --namespace flag
# This is for documentation purposes
namespace: default

# This will set the replicaset count more information can be found here: https://kubernetes.io/docs/concepts/workloads/controllers/replicaset/
replicaCount: 1

# MCP Server Configuration
mcp:
  # Transport protocol: stdio, streamable-http, sse
  transport: "streamable-http"  # Default to streamable-http
  # Server configuration for HTTP transports
  server:
    host: "0.0.0.0"
    port: 8000

# Container image configuration
image:
  repository: ghcr.io/bluefoxlabsai/placer-ai-mcp
  pullPolicy: IfNotPresent
  tag: "latest"

# Image pull secrets for private repositories
imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

# Service account configuration
serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Automatically mount a ServiceAccount's API credentials?
  automount: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""

# Pod annotations
podAnnotations: {}

# Pod labels
podLabels: {}

# Pod security context
podSecurityContext:
  fsGroup: 1000

# Container security context
securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
    - ALL
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  runAsUser: 1000

# Service configuration
service:
  enabled: "auto"  # auto, true, false - auto enables for streamable-http/sse transports
  type: ClusterIP
  port: 8000

# Ingress configuration
ingress:
  enabled: false
  className: ""
  annotations: {}
    # kubernetes.io/ingress.class: nginx
    # kubernetes.io/tls-acme: "true"
  hosts:
    - host: placer-ai-mcp.local
      paths:
        - path: /
          pathType: Prefix
  tls: []
  #  - secretName: placer-ai-mcp-tls
  #    hosts:
  #      - placer-ai-mcp.local

# Resource limits and requests
resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 100m
    memory: 128Mi

# Health probes (enabled for streamable-http transport)
livenessProbe:
  enabled: true
  httpGet:
    path: /health
    port: http
    scheme: HTTP
  initialDelaySeconds: 30
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 6
  successThreshold: 1

readinessProbe:
  enabled: true
  httpGet:
    path: /health
    port: http
    scheme: HTTP
  initialDelaySeconds: 5
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 6
  successThreshold: 1

# Autoscaling
autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 100
  targetCPUUtilizationPercentage: 80
  # targetMemoryUtilizationPercentage: 80

# Additional volumes on the output Deployment definition.
volumes: []
# - name: foo
#   secret:
#     secretName: mysecret
#     optional: false

# Additional volumeMounts on the output Deployment definition.
volumeMounts: []
# - name: foo
#   mountPath: "/etc/foo"
#   readOnly: true

# Node selector
nodeSelector: {}

# Tolerations
tolerations: []

# Affinity
affinity: {}

# Placer.ai specific configuration
placerAI:
  # API Key - REQUIRED
  # Get your API key from: https://www.placer.ai/
  apiKey: "" # Set via --set placerAI.apiKey=your-key or values file
  
  # Base URL for Placer.ai API
  baseUrl: "https://api.placer.ai/v1"
  
  # Cache configuration
  cache:
    ttl: 300 # 5 minutes
    maxSize: 1000
  
  # Request timeout in seconds
  timeout: 30
  
  # Secret configuration - if you prefer to manage secrets externally
  # Create secret: kubectl create secret generic placer-ai-secret --from-literal=api-key=your-key
  existingSecret: ""
  secretKeys:
    apiKey: "api-key"

# Environment variables
env: []

# Environment variables from ConfigMaps or Secrets
envFrom: []

# HTTPRoute configuration (for Gateway API)
httpRoute:
  enabled: false
  annotations: {}
  parentRefs: []
  hostnames: []
  rules: []