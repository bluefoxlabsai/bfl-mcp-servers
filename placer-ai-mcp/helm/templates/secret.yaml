{{- if and .Values.placerAI.apiKey (not .Values.placerAI.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "placer-ai-mcp.secretName" . }}
  labels:
    {{- include "placer-ai-mcp.labels" . | nindent 4 }}
type: Opaque
data:
  # Placer.ai API credentials
  api-key: {{ .Values.placerAI.apiKey | b64enc | quote }}
{{- end }}