apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "placer-ai-mcp.fullname" . }}
  labels:
    {{- include "placer-ai-mcp.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "placer-ai-mcp.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "placer-ai-mcp.labels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "placer-ai-mcp.serviceAccountName" . }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: {{ .Chart.Name }}
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- if eq .Values.mcp.transport "stdio" }}
          command: ["/bin/sh", "-c"]
          args: 
            - |
              echo "Placer.ai MCP Server is ready (stdio mode)"
              echo "This server uses MCP (Model Context Protocol) via stdio"
              echo "To connect, use: kubectl exec -it <pod-name> -- uv run mcp-placer-ai"
              echo "Placer.ai API credentials are configured and ready"
              
              # Keep container running for exec access
              while true; do
                sleep 300
                echo "MCP Server container is running - $(date)"
              done
          {{- else }}
          # Use the Dockerfile entrypoint which runs: uv run mcp-placer-ai --transport streamable-http --host 0.0.0.0 --port 8000
          {{- end }}
          env:
            - name: PYTHONPATH
              value: "/app"
            # Placer.ai API Configuration
            {{- if .Values.placerAI.apiKey }}
            - name: PLACER_AI_API_KEY
              {{- if .Values.placerAI.existingSecret }}
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.placerAI.existingSecret }}
                  key: {{ .Values.placerAI.secretKeys.apiKey | default "api-key" }}
              {{- else }}
              value: {{ .Values.placerAI.apiKey | quote }}
              {{- end }}
            {{- end }}
            {{- if .Values.placerAI.baseUrl }}
            - name: PLACER_AI_BASE_URL
              value: {{ .Values.placerAI.baseUrl | quote }}
            {{- end }}
            {{- if .Values.placerAI.timeout }}
            - name: PLACER_AI_TIMEOUT
              value: {{ .Values.placerAI.timeout | quote }}
            {{- end }}
            {{- if .Values.placerAI.cache.ttl }}
            - name: PLACER_AI_CACHE_TTL
              value: {{ .Values.placerAI.cache.ttl | quote }}
            {{- end }}
            {{- if .Values.placerAI.cache.maxSize }}
            - name: PLACER_AI_CACHE_MAX_SIZE
              value: {{ .Values.placerAI.cache.maxSize | quote }}
            {{- end }}
            {{- with .Values.env }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- with .Values.envFrom }}
          envFrom:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- if or (eq .Values.mcp.transport "streamable-http") (eq .Values.mcp.transport "sse") }}
          ports:
            - name: http
              containerPort: {{ .Values.mcp.server.port }}
              protocol: TCP
          {{- end }}
          {{- if and .Values.livenessProbe.enabled (or (eq .Values.mcp.transport "streamable-http") (eq .Values.mcp.transport "sse")) }}
          livenessProbe:
            {{- omit .Values.livenessProbe "enabled" | toYaml | nindent 12 }}
          {{- end }}
          {{- if and .Values.readinessProbe.enabled (or (eq .Values.mcp.transport "streamable-http") (eq .Values.mcp.transport "sse")) }}
          readinessProbe:
            {{- omit .Values.readinessProbe "enabled" | toYaml | nindent 12 }}
          {{- end }}
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.volumeMounts }}
          volumeMounts:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      {{- with .Values.volumes }}
      volumes:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}